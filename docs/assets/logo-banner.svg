<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="55%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="60%" stop-color="#7c6ff0"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.2" cy="0.25" r="0.9">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.75" r="0.9">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#6366f1" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1400" height="360" fill="url(#glow1)"/>
  <rect width="1400" height="360" fill="url(#glow2)"/>

  <!-- Mark -->
  <g filter="url(#softShadow)">
    <rect x="70" y="90" width="180" height="180" rx="44" fill="url(#brandGrad)"/>
  </g>
  <!-- Sofa/home glyph, simplified, inside the mark -->
  <g transform="translate(105,132)">
    <path d="M12 62 V40 a14 14 0 0 1 14-14 h84 a14 14 0 0 1 14 14 v22" stroke="white" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="4" y="58" width="30" height="34" rx="9" fill="white"/>
    <rect x="86" y="58" width="30" height="34" rx="9" fill="white"/>
    <rect x="4" y="86" width="112" height="12" rx="6" fill="white"/>
    <circle cx="20" cy="104" r="7" fill="white"/>
    <circle cx="100" cy="104" r="7" fill="white"/>
  </g>

  <!-- Wordmark -->
  <text x="290" y="205" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="104" font-weight="800" fill="#0f172a">Rent<tspan fill="url(#textGrad)">Ease</tspan></text>

  <!-- Tagline -->
  <text x="294" y="255" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="30" font-weight="500" fill="#64748b">Furniture &amp; Appliance Rental Platform</text>

  <!-- Divider dot row -->
  <g transform="translate(294,285)" fill="#94a3b8" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="22" font-weight="600">
    <text x="0" y="20">4 Cities</text>
    <circle cx="92" cy="14" r="3"/>
    <text x="108" y="20">4 Roles</text>
    <circle cx="204" cy="14" r="3"/>
    <text x="220" y="20">116+ API Endpoints</text>
    <circle cx="452" cy="14" r="3"/>
    <text x="468" y="20">MERN Stack</text>
  </g>
</svg>
