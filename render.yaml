services:
  - type: web
    name: rentease-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /api/v1/cities
    envVars:
      - key: NODE_ENV
        value: production
      # Render's own reverse proxy expects the app on port 10000 unless told otherwise, and
      # falls back to an unreliable port scan if PORT is left unset — src/config/env.js reads
      # process.env.PORT but defaults to 5000 (this app's local-dev port) when it's absent, so
      # omitting this line here previously produced a real, confirmed bug: the process runs and
      # binds fine, just on a port Render's proxy never finds, which is exactly what an
      # `x-render-routing: no-server` response on every request means. Must match whatever the
      # Render dashboard's own PORT value is for this service if that's ever changed by hand.
      - key: PORT
        value: "10000"
      - key: DEMO_MODE
        value: "true"
      # sync: false values are only prompted once, at initial Blueprint creation — Render then
      # ignores them on every later sync, so changing one on an already-created service means
      # editing it directly on the service's own Environment tab in the dashboard, not through
      # render.yaml. CLIENT_URL is this app's own public frontend origin (not a secret — the
      # same value is already hardcoded as a CORS fallback in backend/src/app.js).
      # MONGODB_URI is a real secret and must never have a value committed here.
      - key: CLIENT_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      # Generated once at first creation, not copied from anywhere — simplest correct choice for
      # a standalone deployment. This app reads three separate secrets (env.js), not one combined
      # JWT_SECRET, so all three are declared here rather than a single key the code wouldn't
      # recognize.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: EMAIL_TOKEN_SECRET
        generateValue: true
