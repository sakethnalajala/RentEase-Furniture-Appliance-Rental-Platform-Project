# Values that need to stay editable from the Render dashboard AFTER the service already
# exists (not just at first-time Blueprint creation) belong in an envVarGroup, not directly on
# the service's own envVars with sync: false. Render only prompts for a service-level
# `sync: false` var once, during initial Blueprint setup, and ignores it on every later sync —
# which is exactly what produces a dashboard error when you try to edit one on an
# already-created, Blueprint-managed service. Env var group values remain manageable from the
# dashboard indefinitely. See https://render.com/docs/blueprint-spec.
envVarGroups:
  - name: rentease-secrets
    envVars:
      # Not a secret (it's this app's own public frontend origin — already hardcoded as a CORS
      # fallback in backend/src/app.js too), pre-filled so there's one less manual step. Still
      # freely editable from the dashboard afterward if the frontend URL ever changes.
      - key: CLIENT_URL
        value: https://rentease-furniture-rental-ecru.vercel.app
      # A real secret (contains DB credentials) — deliberately no value here. Set it once from
      # the Render dashboard: this service -> Environment -> find MONGODB_URI in the
      # rentease-secrets group -> paste your MongoDB Atlas connection string.
      - key: MONGODB_URI
        sync: false

services:
  - type: web
    name: rentease-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /api/v1/cities
    envVarGroups:
      - rentease-secrets
    envVars:
      - key: NODE_ENV
        value: production
      # Render's own reverse proxy expects the app on port 10000 unless told otherwise, and
      # falls back to an unreliable port scan if PORT is left unset — src/config/env.js reads
      # process.env.PORT but defaults to 5000 (this app's local-dev port) when it's absent, so
      # omitting this line here previously produced a real, confirmed bug: the process runs and
      # binds fine, just on a port Render's proxy never finds, which is exactly what an
      # `x-render-routing: no-server` response on every request means. Must match whatever the
      # Render dashboard's own PORT value is for this service if that's ever changed by hand.
      - key: PORT
        value: "10000"
      - key: DEMO_MODE
        value: "true"
      # Generated once at first creation, not copied from anywhere -- simplest correct choice
      # for a standalone deployment. this app reads three separate secrets (env.js), not one
      # combined JWT_SECRET, so all three are declared here rather than a single key that
      # wouldn't match what the code actually looks for.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: EMAIL_TOKEN_SECRET
        generateValue: true
