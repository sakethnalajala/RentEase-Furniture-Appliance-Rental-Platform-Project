services:
  - type: web
    name: rentease-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /api/v1/cities
    envVars:
      - key: NODE_ENV
        value: production
      # Render's own reverse proxy expects the app on port 10000 unless told otherwise, and
      # falls back to an unreliable port scan if PORT is left unset — src/config/env.js reads
      # process.env.PORT but defaults to 5000 (this app's local-dev port) when it's absent, so
      # omitting this line here previously produced a real, confirmed bug: the process runs and
      # binds fine, just on a port Render's proxy never finds, which is exactly what an
      # `x-render-routing: no-server` response on every request means. Must match whatever the
      # Render dashboard's own PORT value is for this service if that's ever changed by hand.
      - key: PORT
        value: "10000"
      - key: DEMO_MODE
        value: "true"
      # The two values below are the only manual input this blueprint asks for — Render
      # prompts for them during setup. CLIENT_URL is the deployed frontend's exact origin
      # (Vercel dashboard -> this project -> Settings -> Environment Variables -> CLIENT_URL,
      # reveal to copy). MONGODB_URI must be the SAME connection string the existing Vercel
      # backend uses (same dashboard, MONGODB_URI, reveal to copy) so this becomes a second
      # backend pointed at the identical database rather than a fresh, empty one.
      - key: CLIENT_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      # Freshly generated rather than copied from the Vercel deployment -- simplest correct
      # choice for a one-time migration. The one visible effect: any session issued by the old
      # Vercel backend won't verify against these new secrets, so every user's very next
      # request there is treated as logged-out and they sign in again once. Nothing breaks;
      # it's just a normal login, same as any other session expiring.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: EMAIL_TOKEN_SECRET
        generateValue: true
